name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  verify:
    name: Typecheck & unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-desktop:
    name: Desktop (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: desktop-windows
          - os: macos-14
            platform: mac
            artifact: desktop-macos
          - os: ubuntu-24.04
            platform: linux
            artifact: desktop-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Resolve version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag: keeping the version from package.json"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER="${TAG#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VER (from tag $TAG)"

      - run: npm ci
      - run: npm run build

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools rpm fakeroot file \
            libgtk-3-0 libnss3 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools rpm fakeroot file libgtk-3-0 libnss3 libasound2

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        shell: bash
        run: |
          set -euo pipefail
          # macOS: build both arches from the single runner so Apple Silicon
          # users get a native build too. Other platforms build their native arch.
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --mac --x64 --arm64 --publish never
          else
            npx electron-builder --${{ matrix.platform }} --publish never
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.zip
            release/**/*.AppImage
            release/**/*.tar.gz

  build-android:
    name: Android APK
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_SDK_ROOT:-}" ] && [ -z "${ANDROID_HOME:-}" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$d" ]; then export ANDROID_SDK_ROOT="$d"; break; fi
            done
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "Android SDK not found" >&2
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          echo "Using SDK at $SDK"

      - name: Resolve version from release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --exact-match 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No release tag: keeping the version from package.json"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VER="${TAG#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VER (from tag $TAG)"

      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Assemble APKs
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          cd ..
          VERSION="${{ steps.version.outputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./package.json').version")
          fi
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "apk-out/PSD-Combo-Exporter-${VERSION}-android-debug.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk \
             "apk-out/PSD-Combo-Exporter-${VERSION}-android-release-unsigned.apk"
          ls -la apk-out

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 14
          path: apk-out/*.apk

  publish:
    name: Publish release assets
    needs: [build-desktop, build-android]
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: dist-all

      - name: Collect artifacts
        run: |
          mkdir -p out
          find dist-all -type f \( \
               -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
            -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.apk' \) \
            -exec cp -v {} out/ \;
          ls -la out

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            gh release upload "$TAG_NAME" out/* --clobber
          else
            gh release view "$TAG_NAME" >/dev/null 2>&1 || \
              gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes
            gh release upload "$TAG_NAME" out/* --clobber
          fi
